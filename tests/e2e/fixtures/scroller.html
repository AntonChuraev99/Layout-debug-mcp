<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>e2e: a scrolling list</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { font: 14px/1.4 system-ui, sans-serif; }
      /* An inner scroller: 300 px of a 20-row list, no border or padding, so a row sits at
         list top + index × 48 − scrollTop. */
      .list { position: absolute; left: 100px; top: 100px; width: 360px; height: 300px; overflow: auto; background: #f3f5f8; }
      .item { box-sizing: border-box; height: 48px; padding: 12px 16px; border-bottom: 1px solid #dfe3ea; background: #fff; }
      /* Content right under the list: a ghost leaking out of the list would cover it. */
      .below { position: absolute; left: 100px; top: 410px; width: 360px; height: 80px; background: #9cc4ff; }
    </style>
  </head>
  <body>
    <div class="list" data-testid="list">
      <div class="item" data-testid="item-0">Row 0</div>
      <div class="item" data-testid="item-1">Row 1</div>
      <div class="item" data-testid="item-2">Row 2</div>
      <div class="item" data-testid="item-3">Row 3</div>
      <div class="item" data-testid="item-4">Row 4</div>
      <div class="item" data-testid="item-5">Row 5</div>
      <div class="item" data-testid="item-6">Row 6</div>
      <div class="item" data-testid="item-7">Row 7</div>
      <div class="item" data-testid="item-8">Row 8</div>
      <div class="item" data-testid="item-9">Row 9</div>
      <div class="item" data-testid="item-10">Row 10</div>
      <div class="item" data-testid="item-11">Row 11</div>
      <div class="item" data-testid="item-12">Row 12</div>
      <div class="item" data-testid="item-13">Row 13</div>
      <div class="item" data-testid="item-14">Row 14</div>
      <div class="item" data-testid="item-15">Row 15</div>
    </div>
    <div class="below" data-testid="below"></div>
    __INSPECTOR__
  </body>
</html>
