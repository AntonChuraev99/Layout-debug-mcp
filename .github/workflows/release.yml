# Publishes to npm (trusted publishing, OIDC) and to the MCP Registry on a version tag.
# Keep this file name: the npm trusted publisher is bound to "release.yml".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing and mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in the release job (cache poisoning).
          package-manager-cache: false

      - name: Use npm with trusted publishing (>= 11.5.1)
        run: |
          npm i -g npm@latest
          npm --version

      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: |
          # A pre-release (1.2.3-rc.1) must not become "latest".
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Wait until the version is visible on npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if [ "$(npm view "layout-debug-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "layout-debug-mcp@$VERSION is on npm"
              exit 0
            fi
            sleep 10
          done
          echo "::error::layout-debug-mcp@$VERSION did not appear on npm within 5 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Set server.json version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
