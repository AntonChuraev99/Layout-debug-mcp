name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  pack-smoke:
    name: Pack smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.19', '22']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the tarball
        run: |
          npm pack
          mkdir ../ld-smoke
          mv layout-debug-mcp-*.tgz ../ld-smoke/
      - name: Install the tarball into a fresh folder
        working-directory: ../ld-smoke
        run: |
          npm init -y > /dev/null
          npm i ./layout-debug-mcp-*.tgz
      - name: Run the bin
        working-directory: ../ld-smoke
        run: npx layout-debug-mcp --version
      - name: MCP initialize handshake and listTools
        working-directory: ../ld-smoke
        run: |
          cat > smoke.mjs <<'EOF'
          import { readFileSync } from 'node:fs'
          import { dirname, join } from 'node:path'
          import { Client } from '@modelcontextprotocol/sdk/client/index.js'
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js'

          const timer = setTimeout(() => {
            console.error('MCP smoke timed out after 60 s')
            process.exit(1)
          }, 60_000)

          // Start the installed bin with node directly: no npx/.cmd shim, same on every OS.
          const pkgPath = join('node_modules', 'layout-debug-mcp', 'package.json')
          const pkg = JSON.parse(readFileSync(pkgPath, 'utf8'))
          const bin = typeof pkg.bin === 'string' ? pkg.bin : pkg.bin['layout-debug-mcp']
          const binPath = join(dirname(pkgPath), bin)

          const transport = new StdioClientTransport({
            command: process.execPath,
            args: [binPath],
            stderr: 'inherit',
          })
          const client = new Client({ name: 'ci-pack-smoke', version: '0.0.0' })
          await client.connect(transport)
          const { tools } = await client.listTools()
          const names = tools.map((t) => t.name)
          console.log('server:', JSON.stringify(client.getServerVersion()))
          console.log('tools:', names.join(', '))
          const missing = ['open_window', 'wait_for_message'].filter((n) => !names.includes(n))
          await client.close()
          clearTimeout(timer)
          if (missing.length) {
            console.error('missing tools:', missing.join(', '))
            process.exit(1)
          }
          EOF
          node smoke.mjs
      - name: Packaged window served from the server port
        working-directory: ../ld-smoke
        env:
          LD_NO_BROWSER: '1'
        run: |
          set -u
          # The installed bin, run with node directly (no npx/.cmd shim), on a free port.
          bin=$(node -p "const p=require('./node_modules/layout-debug-mcp/package.json'); require('path').join('node_modules/layout-debug-mcp', typeof p.bin === 'string' ? p.bin : p.bin['layout-debug-mcp'])")
          port=$(node -e "const s=require('net').createServer().listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")
          base="http://127.0.0.1:$port"
          LD_SERVER_PORT=$port node "$bin" window > window.log 2>&1 &
          pid=$!
          stop() {
            # Graceful first: /api/shutdown accepts a local non-browser client (curl sends no Origin).
            curl -fsS -X POST "$base/api/shutdown" > /dev/null 2>&1 || true
            for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || return 0; sleep 0.5; done
            kill "$pid" 2>/dev/null || true
            sleep 1
            # Git Bash on Windows: the background job may not map to the node process; end it by image.
            if kill -0 "$pid" 2>/dev/null && [ "${RUNNER_OS:-}" = "Windows" ]; then
              taskkill //F //T //IM node.exe > /dev/null 2>&1 || true
            fi
          }
          trap stop EXIT
          up=""
          for _ in $(seq 1 60); do
            if curl -fsS "$base/api/health" > health.json 2>/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "server did not answer at $base"; cat window.log; exit 1; fi
          cat health.json; echo
          grep -q '"name":"layout-debug-mcp"' health.json
          curl -fsS -D headers.txt "$base/" > window.html
          if ! grep -q '<title>layout-debug</title>' window.html; then echo "GET / is not the window:"; head -c 500 window.html; exit 1; fi
          grep -qi "frame-ancestors 'none'" headers.txt
          echo "window served at $base/"
          cat window.log
